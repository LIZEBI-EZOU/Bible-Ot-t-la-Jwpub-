name: Android APK - Bible Otetela

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and validate source Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s BibleJW-Otetela-main-1.zip
          rm -rf source_project
          mkdir -p source_project
          unzip -q BibleJW-Otetela-main-1.zip -d source_project
          PROJECT="source_project/BibleJW-Otetela-main"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/java/com/biblejw/app/MainActivity.java"
          test -f "$PROJECT/app/src/main/assets/index.html"
          python3 "$PROJECT/tools_validate.py" || true

      - name: Generate Gradle wrapper
        working-directory: source_project/BibleJW-Otetela-main
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Run unit tests
        working-directory: source_project/BibleJW-Otetela-main
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        working-directory: source_project/BibleJW-Otetela-main
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        working-directory: source_project/BibleJW-Otetela-main
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bible-Otetela-debug-apk
          path: source_project/BibleJW-Otetela-main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
