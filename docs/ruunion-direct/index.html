<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUUNION DIRECT</title><script src="https://meet.jit.si/external_api.js"></script><style>body{font-family:Arial;background:#0c0e10;color:#eee;margin:0}main{max-width:760px;margin:auto;padding:28px}input,button{padding:12px;margin:5px;border-radius:8px}input{background:#15181b;color:#fff;border:1px solid #444}button{background:#e8a33d;border:0}#call{display:none;position:fixed;inset:0;background:#000}#jitsi{position:absolute;inset:0}</style></head><body><main><h1>RUUNION DIRECT</h1><p>Réunion vidéo depuis votre navigateur.</p><input id="n" placeholder="Votre nom"><input id="c" placeholder="Code de réunion"><button onclick="go()">Rejoindre</button><p>Pour démarrer une salle, utilisez un code personnel et partagez le lien Jitsi.</p></main><div id="call"><div id="jitsi"></div><button onclick="closeCall()">Quitter</button></div><script>let a;function go(){let c=document.getElementById("c").value.trim().toLowerCase();if(!c)return alert("Entrez un code");document.getElementById("call").style.display="block";a=new JitsiMeetExternalAPI("meet.jit.si",{roomName:"ruunion-direct-"+c,parentNode:document.getElementById("jitsi"),width:"100%",height:"100%",userInfo:{displayName:document.getElementById("n").value||"Invité"},configOverwrite:{prejoinPageEnabled:true}})}function closeCall(){if(a)a.dispose();document.getElementById("call").style.display="none"}</script></body></html>
